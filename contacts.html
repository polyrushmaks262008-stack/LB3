<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Космічний туризм - Контакти</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #f0f6fc;
        }
        header {
            background-color: #161b22;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #30363d;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 10px 0 0 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        nav a {
            color: #58a6ff;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            display: flex;
            min-height: 400px;
        }
        aside {
            flex: 1;
            background-color: #11161d;
            padding: 20px;
            border-right: 1px solid #30363d;
        }
        main {
            flex: 3;
            padding: 20px;
            background-color: #0d1117;
        }
        form div {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            max-width: 400px;
            padding: 8px;
            background-color: #161b22;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #238636;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2ea043;
        }
        footer {
            background-color: #161b22;
            text-align: center;
            padding: 15px;
            border-top: 1px solid #30363d;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Космічні Подорожі майбутнього</h1>
        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="planets.html">Планети</a></li>
                <li><a href="tours.html">Тури</a></li>
                <li><a href="contacts.html">Контакти</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <aside>
            <h3>Гаряча лінія</h3>
            <p><strong>Тел:</strong> +380 (44) 000-00-00</p>
            <p><strong>Email:</strong> info@space-tour.com</p>
        </aside>
        
        <main>
            <h2>Зв'яжіться з нами</h2>
            <p>Залиште заявку на бронювання туру або поставте запитання:</p>

            <form action="#" method="post">
                <div>
                    <label for="name">Ваше ім'я:</label>
                    <input type="text" id="name" name="name" placeholder="Введіть ім'я" required>
                </div>
                <div>
                    <label for="email">Ваш Email:</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" required>
                </div>
                <div>
                    <label for="message">Повідомлення:</label>
                    <textarea id="message" name="message" rows="4" placeholder="Ваше запитання..."></textarea>
                </div>
                <button type="submit">Надіслати</button>
            </form>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Космічний Туризм. Всі права захищені.</p>
    </footer>

</body>
</html>
